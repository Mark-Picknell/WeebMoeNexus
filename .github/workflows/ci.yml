name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build and test
        run: npm run check

      - name: Retain scoped offline validation status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-validation-status
          path: artifacts/validation-report.*
          if-no-files-found: warn
